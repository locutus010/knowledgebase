# Baut die drei Container-Images und legt sie in der GitHub Container Registry ab:
#   ghcr.io/locutus010/knowledgebase-app      Backend (FastAPI)
#   ghcr.io/locutus010/knowledgebase-web      Caddy mit der gebauten Oberfläche
#   ghcr.io/locutus010/knowledgebase-backup   kb-backup / kb-restore
#
# Ausgelöst durch eine veröffentlichte Release, nicht durch jeden Push auf main.
# 'workflow_dispatch' bleibt für den Handbetrieb, wenn ein Build nachgeholt werden muss.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Erst alles testen — veröffentlicht wird nur, was hier durchkommt.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Die Backend-Tests starten ein echtes PostgreSQL per testcontainers; Docker ist auf
      # ubuntu-latest vorhanden.
      - uses: astral-sh/setup-uv@v5
      - name: Backend-Tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend-Tests und Typprüfung
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Ohne 'packages: write' darf der GITHUB_TOKEN nicht in die Registry schreiben.
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            context: backend
            file: backend/Dockerfile
          - name: web
            # Kontext ist die Wurzel: das Image braucht frontend/ und das Caddyfile.
            context: .
            file: frontend/Dockerfile
          - name: backup
            context: backup
            file: backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Marken aus dem Release-Tag: 'v0.1.0' wird zu '0.1.0', '0.1' und 'latest'. Bei einem
      # Handlauf gibt es kein Tag; dann nur der Commit-Hash, 'latest' bleibt unangetastet.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/locutus010/knowledgebase-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=knowledgebase-${{ matrix.name }}
            org.opencontainers.image.description=Wissensdatenbank (${{ matrix.name }})

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 und arm64, damit dieselben Images auf einem NAS oder Raspberry Pi laufen.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
