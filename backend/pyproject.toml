[project]
name = "kb"
version = "0.1.0"
description = "Wissensdatenbank für Teams"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "joserfc>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:kb.*"]

[tool.hatch.build.targets.wheel]
packages = ["kb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
