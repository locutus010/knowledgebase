# Wissensdatenbank — kompletter Stack.
#   cp .env.example .env   # Werte eintragen
#   docker compose up -d --build --wait
#   docker compose exec app python -m kb create-admin --email du@firma.de --name "Dein Name"

name: wissensdatenbank

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_DB: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./backend
    image: wissensdatenbank-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      KB_DATABASE_URL: postgresql+psycopg://kb:${POSTGRES_PASSWORD}@db:5432/kb
      KB_SECRET_KEY: ${KB_SECRET_KEY:?KB_SECRET_KEY fehlt in .env (openssl rand -hex 32)}
      KB_DOMAIN: ${KB_DOMAIN:-}
      KB_MAX_UPLOAD_MB: ${KB_MAX_UPLOAD_MB:-25}
      KB_OIDC_ISSUER: ${KB_OIDC_ISSUER:-}
      KB_OIDC_CLIENT_ID: ${KB_OIDC_CLIENT_ID:-}
      KB_OIDC_CLIENT_SECRET: ${KB_OIDC_CLIENT_SECRET:-}
      KB_OIDC_BUTTON_LABEL: ${KB_OIDC_BUTTON_LABEL:-SSO}
      KB_OIDC_GROUPS_CLAIM: ${KB_OIDC_GROUPS_CLAIM:-groups}
      KB_OIDC_ADMIN_GROUPS: ${KB_OIDC_ADMIN_GROUPS:-}
      KB_OIDC_EDITOR_GROUPS: ${KB_OIDC_EDITOR_GROUPS:-}
      KB_OIDC_DEFAULT_ROLE: ${KB_OIDC_DEFAULT_ROLE:-reader}
      KB_BOOTSTRAP_ADMIN_EMAIL: ${KB_BOOTSTRAP_ADMIN_EMAIL:-}
      KB_BOOTSTRAP_ADMIN_PASSWORD: ${KB_BOOTSTRAP_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - uploads:/data/uploads
    # Kein Port nach außen: die App ist nur über Caddy erreichbar.

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: wissensdatenbank-web:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      KB_SITE_ADDRESS: ${KB_DOMAIN:-:80}
      KB_MAX_UPLOAD_MB: ${KB_MAX_UPLOAD_MB:-25}
    ports:
      # Vorgabe: nur lokal erreichbar. Mit eigener Domain KB_BIND=0.0.0.0, KB_HTTP_PORT=80,
      # KB_HTTPS_PORT=443 setzen — dann holt Caddy das Zertifikat selbst.
      - "${KB_BIND:-127.0.0.1}:${KB_HTTP_PORT:-8080}:80"
      - "${KB_BIND:-127.0.0.1}:${KB_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    build: ./backup
    image: wissensdatenbank-backup:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: kb
      POSTGRES_DB: kb
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KB_BACKUP_KEEP_DAYS: ${KB_BACKUP_KEEP_DAYS:-14}
      KB_BACKUP_TIME: ${KB_BACKUP_TIME:-02:30}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Schreibbar nur für kb-restore; die tägliche Sicherung liest bloß.
      - uploads:/uploads
      - ${KB_BACKUP_DIR:-./backups}:/backups

volumes:
  pgdata:
  # Nur genutzt, wenn KB_BACKUP_DIR=backups gesetzt ist (Volume statt Host-Ordner).
  backups:
  uploads:
  caddy_data:
  caddy_config:
